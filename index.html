<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yerba El Pueblo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #3a3a3a;
    }
    header {
      text-align: center;
      padding: 30px 10px;
      background-color: #f5efe4;
    }
    header img {
      width: 140px;
      height: auto;
    }
    h1 {
      margin-top: 10px;
      font-size: 2.2rem;
      color: #2f2f2f;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 40px;
    }
    .product {
      background-color: #f9f5ee;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .product img {
      width: 120px;
      height: auto;
      margin-bottom: 15px;
    }
    .product h3 {
      margin-bottom: 10px;
      font-size: 1.3rem;
    }
    .product a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background-color: #e6d9c3;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .product a:hover {
      background-color: #d8c9b1;
    }
  </style>
</head>
<body>

<header>
  <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAx" alt="Logo" />
  <h1>Yerba El Pueblo</h1>
  <p>Productos artesanales de yerba mate</p>
</header>

<section class="products">
  <div class="product">
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAx" alt="Producto 1" />
    <h3>Yerba Clásica</h3>
    <p>Blend tradicional, sabor intenso.</p>
    <a href="https://wa.me/">Consultar por WhatsApp</a>
  </div>

  <div class="product">
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAx" alt="Producto 2" />
    <h3>Yerba Suave</h3>
    <p>Menos intensidad, misma calidad.</p>
    <a href="https://www.instagram.com/">Consultar por Instagram</a>
  </div>
</section>

</body>
</html>
